<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ElonPup is the future of meme tokens with rewards, anti-whale protection, auto-burn features, and more!">
    <title>ElonPup</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Quicksand:wght@500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1, h2, h3 {
            color: #ff7675;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .hero h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-transform: uppercase;
            animation: fadeIn 1.5s ease-out;
        }

        .hero p {
            font-size: 1.3em;
            color: #ecf0f1;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .btn {
            padding: 18px 40px;
            background-color: #ff7675;
            color: white;
            font-size: 1.1em;
            text-decoration: none;
            border-radius: 50px;
            display: inline-block;
            margin-top: 20px;
            transition: background-color 0.3s, transform 0.3s;
        }

        .btn:hover {
            background-color: #e74c3c;
            transform: scale(1.05);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 80px;
        }

        .feature-card {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.7);
        }

        .feature-card h2 {
            font-size: 1.8em;
            margin-top: 20px;
            color: #ff7675;
        }

        .feature-card p {
            font-size: 1.2em;
            color: #ecf0f1;
            opacity: 0.9;
        }

        .feature-card i {
            font-size: 60px;
            color: #ff7675;
            margin-bottom: 20px;
        }

        .about-section {
            background: #222;
            padding: 60px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            margin-top: 100px;
            text-align: center;
        }

        .about-section h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #fdbb2d;
        }

        .about-section p {
            font-size: 1.1em;
            color: #ecf0f1;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.6;
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5em;
            }

            .feature-card {
                padding: 20px;
            }
        }

    </style>
</head>
<body>

    <div class="container">

        <div class="hero">
            <h1>Welcome to ElonPup 🚀🐶</h1>
            <p>The future of meme tokens, blending innovation, rewards, and security.</p>
            <a href="#get-started" class="btn">Get ElonPup Now</a>
        </div>

        <div class="features">
            <div class="feature-card">
                <i class="fas fa-fire"></i>
                <h2>Auto-Burn</h2>
                <p>A portion of every transaction is automatically burned to reduce supply, increasing token value over time.</p>
            </div>

            <div class="feature-card">
                <i class="fas fa-wallet"></i>
                <h2>Reflection Rewards</h2>
                <p>Earn passive income by holding ElonPup tokens in your wallet. More tokens are earned with every transaction.</p>
            </div>

            <div class="feature-card">
                <i class="fas fa-shield-alt"></i>
                <h2>Anti-Whale Protection</h2>
                <p>Prevents large holders from manipulating the market by limiting the number of tokens one can hold.</p>
            </div>

            <div class="feature-card">
                <i class="fas fa-sync-alt"></i>
                <h2>Dynamic Fees</h2>
                <p>Transaction fees are adjusted based on market conditions, providing flexibility for the community.</p>
            </div>
        </div>

        <div class="about-section" id="about">
            <h2>About ElonPup</h2>
            <p>ElonPup is a revolutionary meme token designed to combine fun and functionality. It features automatic token burning, rewards for holders, and strong market protections to ensure fair growth. ElonPup is not just a meme – it's a movement to innovate the future of cryptocurrency!</p>
        </div>

        <div class="about-section" id="get-started">
            <h2>Join the Future of Meme Tokens</h2>
            <p>Get your ElonPup tokens today and become part of the next big thing in the crypto world! Stay tuned for exciting developments and collaborations!</p>
            <a href="https://your-link-here.com" class="btn">Buy ElonPup Now</a>
        </div>

    </div>

</body>
</html>
